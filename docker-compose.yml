services:
  db:
    image: pgvector/pgvector:pg16
    container_name: capstone-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capstone-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - CORS_ALLOW_ORIGINS=http://localhost:3000,http://frontend:3000
      - CREATEAI_API_TOKEN=${CREATEAI_API_TOKEN}
      - CREATEAI_API_URL=${CREATEAI_API_URL}
      - CANVAS_BASE_URL=${CANVAS_BASE_URL:-}
      - USER_ACCESS_TOKEN=${USER_ACCESS_TOKEN:-}
      - COURSE_ID=${COURSE_ID:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: capstone-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  db_data:


